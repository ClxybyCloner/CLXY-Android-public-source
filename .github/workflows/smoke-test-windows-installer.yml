name: Smoke test Windows installer
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build workflow run ID containing the Windows artifact
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  install:
    runs-on: windows-latest
    steps:
      - name: Download the Windows build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'clxy-artifact'
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name windows --dir $artifactDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the Windows build artifact' }
      - name: Install, verify files, and uninstall
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'clxy-artifact'
          $setup = Join-Path $artifactDir 'CLXY-Windows-Setup-x64.exe'
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }

          $installDir = Join-Path $env:RUNNER_TEMP 'CLXY-Smoke'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

          $expected = @('clxy.exe', 'core\clxy-core.exe', 'LICENSE')
          $missing = @($expected | Where-Object { -not (Test-Path (Join-Path $installDir $_)) })
          if ($missing.Count -gt 0) { throw "Installed files missing: $($missing -join ', ')" }
          Write-Host "Install verified at $installDir"
          Get-Item (Join-Path $installDir 'clxy.exe'), (Join-Path $installDir 'core\clxy-core.exe'), (Join-Path $installDir 'LICENSE') | Select-Object Name, Length

          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'CLXY - Cloner Xray.lnk'
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut missing: $shortcut" }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($shortcut)
          $target = (Resolve-Path $link.TargetPath).Path
          $expectedTarget = (Resolve-Path (Join-Path $installDir 'clxy.exe')).Path
          if ($target -ne $expectedTarget) { throw "Shortcut target mismatch: $target" }
          Write-Host "Start Menu shortcut verified: $shortcut -> $target"

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller was not installed' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller exited with code $($remove.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'clxy.exe')) { throw 'Application binary remains after uninstall' }
          Write-Host 'Silent install and uninstall both passed.'
