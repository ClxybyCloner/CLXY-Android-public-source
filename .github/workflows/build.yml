# Tests every push and pull request. A manual workflow run can build platform
# artifacts for review. This workflow does not create app releases or publish
# APKs. Signed builds and their release metadata belong in the separate
# distribution repository.
name: Build

on:
  push:
    branches: [main]
    # Documentation-only changes do not start a build.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.7
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # This source snapshot intentionally has no inherited Git history.
      - id: version
        name: Version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app/pubspec.yaml ($v)"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Core
        working-directory: core
        run: |
          go vet ./...
          go test ./...
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: App
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    needs: test
    # Built unless the repository variable PLATFORMS (Settings, Secrets and
    # variables, Actions, Variables) is set and leaves it out, e.g. "linux".
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'windows'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inno Setup
        run: choco upgrade innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify packaged artwork, x64 binaries, and legal text
        shell: pwsh
        run: |
          $v = '${{ needs.test.outputs.version }}'
          $bundle = Join-Path 'dist' "CLXY-$v"
          $artwork = @(Get-ChildItem 'app/assets' -Filter 'dashboard*.png' -File)
          $geography = @(Get-ChildItem 'app/assets' -Filter 'globe-*' -File)
          if ($geography.Count -ne 3) { throw 'Offline globe files are missing' }
          foreach ($source in @($artwork + $geography)) {
            $target = Join-Path $bundle "data/flutter_assets/assets/$($source.Name)"
            if ((Get-FileHash $source.FullName).Hash -ne (Get-FileHash $target).Hash) { throw "Bundled artwork differs: $($source.Name)" }
            Write-Host "Exact bundled artwork: $($source.Name)"
          }
          foreach ($path in @("$bundle/clxy.exe", "$bundle/core/clxy-core.exe")) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) { throw "Not AMD64: $path" }
            Write-Host "Verified AMD64: $path"
          }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/CLXY-$v-Windows-x64.zip"))
          try {
            $reader = [IO.StreamReader]::new($archive.GetEntry('CLXY/LICENSE').Open())
            try { $bundledLicense = $reader.ReadToEnd().Replace("`r`n", "`n") } finally { $reader.Dispose() }
            $sourceLicense = [IO.File]::ReadAllText((Resolve-Path 'LICENSE')).Replace("`r`n", "`n")
            if ($bundledLicense -ne $sourceLicense) { throw 'Bundled legal text changed' }
            Write-Host 'Bundled legal text preserved.'
          } finally { $archive.Dispose() }
      - name: Release names
        shell: pwsh
        run: |
          $v = '${{ needs.test.outputs.version }}'
          New-Item -ItemType Directory out | Out-Null
          Move-Item "dist/CLXY-$v-Windows-x64.zip" out/CLXY-Windows-x64.zip
          Move-Item "dist/CLXY-$v-Windows-Setup-x64.exe" out/CLXY-Windows-Setup-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*
          if-no-files-found: error

      - name: Installer-only private download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: out/CLXY-Windows-Setup-x64.exe
          if-no-files-found: error

  android:
    needs: test
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'android'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: NDK and gomobile
        run: |
          ndk="$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::a release needs the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets"
              exit 1
            fi
            echo "::warning::no release key: the APKs are signed with a debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > app/android/release.jks
          printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > app/android/key.properties
      - name: Build
        run: |
          v='${{ needs.test.outputs.version }}'
          mkdir -p app/android/app/libs
          (cd core && gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags "-s -w -X github.com/armanlife/arman-vpn-client/core/internal/version.Current=$v" \
            -o ../app/android/app/libs/core.aar ./mobile)
          cd app
          flutter pub get
          mkdir -p ../out
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=$v --dart-define=GITHUB_REPO=ClxybyCloner/CLXY-Android
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/CLXY-Android-$abi.apk"
          done
          flutter build apk --release --dart-define=APP_VERSION=$v --dart-define=GITHUB_REPO=ClxybyCloner/CLXY-Android
          cp build/app/outputs/flutter-apk/app-release.apk ../out/CLXY-Android-universal.apk
      - name: Remove the key
        if: always()
        run: rm -f app/android/release.jks app/android/key.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  linux:
    needs: test
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'linux'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build
        run: bash scripts/build-linux-core.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/firefox-vpn-core-linux-*.tar.gz
          if-no-files-found: error

  linux-desktop:
    needs: test
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'linux'))
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # The oldest supported runners: the app runs where their glibc and GTK do.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'amd64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Flutter publishes SDK archives for x64 Linux only; on ARM it runs
      # from its Git tag and fetches its ARM engine itself.
      - name: Flutter (ARM)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build
        run: bash scripts/build-linux.sh
      - name: Release name
        run: |
          mkdir out
          mv "dist/CLXY-${{ needs.test.outputs.version }}-Linux-${{ matrix.arch }}.tar.gz" "out/CLXY-Linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-desktop-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    needs: test
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'macos'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Core tests on macOS
        working-directory: core
        run: go test ./internal/desktop ./internal/config
      - name: Build
        run: bash scripts/build-macos.sh
      - name: Release name
        run: |
          mkdir out
          mv "dist/CLXY-${{ needs.test.outputs.version }}-macOS.dmg" out/CLXY-macOS.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*
          if-no-files-found: error
