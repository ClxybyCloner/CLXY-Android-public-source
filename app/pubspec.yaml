name: clxy
description: "Cross-platform shell for the Go VPN core"
publish_to: 'none'
version: 1.0.27+14149

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  file_selector: ^1.1.0
  webview_flutter: ^4.14.1
  intl: any

# Packages published less than two weeks ago are held back until they have
# been out longer.
dependency_overrides:
  vector_graphics_compiler: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb (l10n.yaml).
  generate: true

  assets:
    # The CLXY mark shown beside the app name (tool/app_icons.py).
    - assets/logo.png
    # Soft-focus, compressed wallpaper shown behind the mobile home and nav bar.
    - assets/dashboard-mobile-wallpaper-extra-blur.jpg
    # The home screen's decorative globe artwork; connection data stays live.
    - assets/cosmic_globe_backdrop.png
    # Night-blue landscape behind the desktop dashboard power control.
    - assets/dashboard-mountains.png
    # Decorative reference artwork; status and telemetry are rendered live.
    - assets/dashboard-reference-hero.png
    - assets/dashboard-sidebar-brand.png
    - assets/dashboard-sidebar-mountains.png
    - assets/dashboard-logo.png
    # The exact CLXY mark already used by the Android notification and launcher.
    - android/app/src/main/res/drawable-nodpi/clxy_brand_mark.png
    # Static brand illustration only; contains no connection state or controls.
    - assets/dashboard-brand-card.png
    # Offline globe geography; network location itself comes from the real core.
    - assets/globe-land.json
    - assets/globe-countries.json
    - assets/globe-LICENSE.txt
    - assets/tray/
    # Country flags from flag-icons (MIT, assets/flags/LICENSE), the same
    # SVG files as the core's web dashboard.
    - assets/flags/

  fonts:
    # Vazirmatn (SIL Open Font License 1.1, assets/fonts/OFL.txt) for Persian.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
